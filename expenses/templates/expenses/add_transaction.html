
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if transaction %}Edit{% else %}Add{% endif %} Transaction
    </title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1e293b;
        }

        .form-box {
            max-width: 500px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px #0f172a12;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button, .back {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            width: 100%;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .back {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .error {
            padding: 12px;
            border-radius: 8px;
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="form-box">
        <h1>
            {% if transaction %}Edit Transaction{% else %}Add Transaction{% endif %}
        </h1>

        <p>Enter the transaction details.</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                maxlength="100"
                value="{% if form_title != None %}{{ form_title }}{% elif transaction %}{{ transaction.title }}{% endif %}"
                placeholder="Example: Salary or Food"
                required
            >

            <label for="amount">Amount (₹)</label>
            <input
                type="number"
                id="amount"
                name="amount"
                min="0.01"
                max="999999999.99"
                step="0.01"
                value="{% if form_amount != None %}{{ form_amount }}{% elif transaction %}{{ transaction.amount }}{% endif %}"
                placeholder="Enter amount"
                required
            >

            <label for="transaction_type">Transaction Type</label>
            <select id="transaction_type" name="transaction_type" required>
                <option value="">Select type</option>

                <option value="Income"
                    {% if form_type == 'Income' or transaction.transaction_type == 'Income' %}selected{% endif %}>
                    Income
                </option>

                <option value="Expense"
                    {% if form_type == 'Expense' or transaction.transaction_type == 'Expense' %}selected{% endif %}>
                    Expense
                </option>
            </select>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                {% for value, label in categories %}
                <option value="{{ value }}"
                    {% if form_category == value or transaction.category == value %}selected{% elif not form_category and not transaction and value == 'Other' %}selected{% endif %}>
                    {{ label }}
                </option>
                {% endfor %}
            </select>

            <button type="submit">
                {% if transaction %}Update Transaction{% else %}Save Transaction{% endif %}
            </button>
        </form>

        <a class="back" href="{% url 'dashboard' %}">
            ← Back to Dashboard
        </a>
    </div>
</body>
</html>
