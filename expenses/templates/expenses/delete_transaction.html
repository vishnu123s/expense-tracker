
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Transaction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1e293b;
            padding: 25px;
        }

        .box {
            max-width: 450px;
            margin: 70px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px #0f172a12;
        }

        .button {
            display: inline-block;
            padding: 12px 18px;
            margin: 8px 4px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .cancel {
            background: #e2e8f0;
            color: #1e293b;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Delete Transaction?</h1>

        <p>Are you sure you want to delete this transaction?</p>

        <h3>{{ transaction.title }}</h3>
        <p>Amount: ₹{{ transaction.amount|floatformat:2 }}</p>
        <p>Type: {{ transaction.transaction_type }}</p>
        <p>Category: {{ transaction.get_category_display }}</p>

        <form method="POST">
            {% csrf_token %}

            <button class="button danger" type="submit">
                Yes, Delete
            </button>

            <a class="button cancel" href="{% url 'dashboard' %}">
                Cancel
            </a>
        </form>
    </div>
</body>
</html>
